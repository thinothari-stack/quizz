services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET in .env}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-quizz}:${POSTGRES_PASSWORD:-change-me}@database:5432/${POSTGRES_DB:-quizz}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MAILER_FROM: "${MAILER_FROM:-no-reply@example.test}"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      WKHTMLTOPDF_PATH: "/usr/bin/wkhtmltopdf"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - quiz_profil:/var/www/html/public/profil
      - quiz_type:/var/www/html/public/type
      - quiz_reponse:/var/www/html/public/reponse
      - quiz_reponse_bonus:/var/www/html/public/reponse_bonus

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-quizz}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      POSTGRES_USER: "${POSTGRES_USER:-quizz}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
  quiz_profil:
  quiz_type:
  quiz_reponse:
  quiz_reponse_bonus:
